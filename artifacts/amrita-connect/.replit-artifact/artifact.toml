kind = "web"
previewPath = "/"
title = "Amrita Connect"
description = "A professional university networking platform helping Amrita students, alumni, faculty, researchers, and staff discover mentors, collaborators, opportunities, and campus connections."
version = "1.0.0"
id = "artifacts/amrita-connect"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 19387

[services.development]
run = "pnpm --filter @workspace/amrita-connect run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/amrita-connect", "run", "build" ]
serve = "static"
publicDir = "artifacts/amrita-connect/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "19387"
BASE_PATH = "/"
